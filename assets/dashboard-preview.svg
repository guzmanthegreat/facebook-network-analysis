    <line x1="500" y1="645" x2="630" y2="570"/><line x1="500" y1="645" x2="660" y2="690"/><line x1="630" y1="570" x2="790" y2="610"/><line x1="660" y1="690" x2="790" y2="610"/><line x1="790" y1="610" x2="940" y2="555"/><line x1="790" y1="610" x2="970" y2="690"/><line x1="940" y1="555" x2="1120" y2="620"/><line x1="970" y1="690" x2="1120" y2="620"/><line x1="1120" y1="620" x2="1260" y2="560"/>
  </g>
  <g fill="#818cf8" stroke="#ffffff" stroke-width="3"><circle cx="500" cy="645" r="13"/><circle cx="630" cy="570" r="16"/><circle cx="660" cy="690" r="12"/><circle cx="790" cy="610" r="22"/><circle cx="940" cy="555" r="14"/><circle cx="970" cy="690" r="11"/><circle cx="1120" cy="620" r="18"/><circle cx="1260" cy="560" r="12"/></g>
  <g fill="#34d399" stroke="#ffffff" stroke-width="3"><circle cx="560" cy="590" r="9"/><circle cx="730" cy="650" r="10"/><circle cx="880" cy="575" r="9"/><circle cx="1050" cy="585" r="10"/></g>
