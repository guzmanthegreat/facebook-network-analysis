<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Facebook Network Analysis dashboard preview</title>
  <desc id="desc">A portfolio preview graphic showing the Facebook Network Analysis dashboard and its network metrics.</desc>
  <rect width="1440" height="820" fill="#f8fafc"/>
  <rect width="270" height="820" fill="#eef2f7"/>
  <rect x="270" width="1170" height="820" fill="#ffffff"/>
  <text x="46" y="72" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111827">About this project</text>
  <text x="46" y="125" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">A network-analysis portfolio</text>
  <text x="46" y="151" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">project built with Python,</text>
  <text x="46" y="177" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">NetworkX, Streamlit, and Plotly.</text>
  <line x1="46" y1="220" x2="224" y2="220" stroke="#cbd5e1"/>
  <text x="46" y="270" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">PAGES</text>
  <text x="46" y="312" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">11,559</text>
  <text x="46" y="371" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">CONNECTIONS</text>
  <text x="46" y="413" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">67,099</text>
  <text x="46" y="472" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">COMMUNITIES</text>
  <text x="46" y="514" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">176</text>
  <text x="46" y="712" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">2017 Facebook Public Figures</text>
  <text x="46" y="744" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Undirected mutual-like network</text>
  <text x="330" y="92" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#111827">Facebook Network Analysis</text>
  <text x="330" y="132" font-family="Arial, sans-serif" font-size="19" fill="#6b7280">Interactive exploration of connections, communities, and structural importance.</text>
  <rect x="330" y="180" width="1050" height="58" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="350" y="180" width="110" height="58" rx="8" fill="#eef2ff"/>
  <text x="375" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4f46e5">Overview</text>
  <text x="500" y="216" font-family="Arial, sans-serif" font-size="16" fill="#374151">Structural Importance</text>
  <text x="760" y="216" font-family="Arial, sans-serif" font-size="16" fill="#374151">Communities</text>
  <text x="900" y="216" font-family="Arial, sans-serif" font-size="16" fill="#374151">Node Explorer</text>
  <text x="1055" y="216" font-family="Arial, sans-serif" font-size="16" fill="#374151">Findings &amp; Limitations</text>
  <text x="330" y="300" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Network overview</text>
  <g font-family="Arial, sans-serif">
    <rect x="330" y="335" width="250" height="120" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="352" y="370" font-size="16" fill="#6b7280">Nodes</text><text x="352" y="420" font-size="32" font-weight="700" fill="#111827">11,559</text>
    <rect x="600" y="335" width="250" height="120" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="622" y="370" font-size="16" fill="#6b7280">Edges</text><text x="622" y="420" font-size="32" font-weight="700" fill="#111827">67,099</text>
    <rect x="870" y="335" width="250" height="120" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="892" y="370" font-size="16" fill="#6b7280">Components</text><text x="892" y="420" font-size="32" font-weight="700" fill="#111827">1</text>
    <rect x="1140" y="335" width="240" height="120" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="1162" y="370" font-size="16" fill="#6b7280">Communities</text><text x="1162" y="420" font-size="32" font-weight="700" fill="#111827">176</text>
  </g>
